plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goldsrc.maker'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "com.goldsrc.maker"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        // Публичный ключ для CI-сборок (не секрет): стабильная подпись, чтобы
        // обновления ставились поверх предыдущих сборок. Для магазина заменить.
        ci {
            storeFile file('../keystore/ci.jks')
            storePassword 'goldsrcmaker'
            keyAlias 'goldsrc'
            keyPassword 'goldsrcmaker'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ci
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
