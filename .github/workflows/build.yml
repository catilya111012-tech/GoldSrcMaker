name: GoldSrcMaker0.0.1-alpha

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GoldSrcMaker0.0.1-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldSrcMaker0.0.1-alpha
          path: app/build/outputs/apk/debug/GoldSrcMaker0.0.1-alpha.apk
